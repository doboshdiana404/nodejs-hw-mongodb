summary: Refresh the access token
operationId: refreshToken
tags:
  - Auth
parameters:
  - in: cookie
    name: refreshToken
    description: The refresh token
    required: true
    schema:
      type: string
responses:
  200:
    description: New access token
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  description: The new access token for the user session
                  example: xi8deii1acfv2gCp06mMjNyDGyrw6pkd+OlOur5s
  400:
    description: Bad request
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Unauthorized'
            data:
              type: string
              example: '"email" is required'
          required:
            - status
            - message
        example:
          status: 400
          message: 'Invalid refresh token'
          data: 'Refresh token cookie is missing or malformed'

  401:
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Unauthorized'
            data:
              type: string
              example: '"email" is required, "emai" is not allowed'
          required:
            - status
            - message
        example:
          status: 401
          message: 'Something went wrong'
          data: 'Refresh token is invalid'
  500:
    $ref: ../../components/responses/500.yaml
