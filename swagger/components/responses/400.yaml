description: Invalid request
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: integer
          example: 401
        message:
          type: string
          example: 'Unauthorized'
        data:
          type: string
          example: '"email" is required, "emai" is not allowed'
      required:
        - status
        - message
    example:
      status: 400
      message: 'Something went wrong'
      data: '"email" is required'
