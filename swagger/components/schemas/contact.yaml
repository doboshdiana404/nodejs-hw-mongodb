type: object
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's number"
    type: string
    example: '+380123456789'
  email:
    description: "Contact's email"
    type: string
    example: 'example@gmail.com'
  isFavourite:
    description: 'Whether is student favourite'
    type: boolean
    example: false
  contactType:
    description: 'Contact`s type'
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    type: string
    example: '67f22a41875fd7d41ec03fd3'
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    type: string
    format: date-time
    example: '2025-04-06T10:53:45.112Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-04-06T10:53:45.112Z'
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt
