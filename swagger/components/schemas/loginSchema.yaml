type: object
properties:
  status:
    type: number
    description: HTTP status code
    example: 200
  message:
    type: string
    example: 'Successfully logged in a user!'
  data:
    type: object
    properties:
      accessToken:
        type: string
        description: JWT access token
        example: 'fggvhjrsxbmk/8yJu3Bin3W6ff6f3kkZHcVT+J+jdf'
required:
  - status
  - message
  - data
