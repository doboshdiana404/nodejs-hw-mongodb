type: object
properties:
  status:
    type: integer
    example: 201
  message:
    type: string
    example: 'User successfully registered.'
  data:
    type: object
    properties:
      id:
        type: string
        example: '67f39f29e3c363521e0ae31d'
      name:
        type: string
        example: 'Tom'
      email:
        type: string
        example: 'tom@gmail.com'
required:
  - status
  - message
  - data
